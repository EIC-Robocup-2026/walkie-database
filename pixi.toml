[workspace]
authors = ["natapol2547 <robloxplay41@gmail.com>"]
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
name = "walkie-database"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
# RoboStack Jazzy builds for Python 3.12.
python = "3.12.*"
ros-jazzy-ros-base = ">=0.11.0,<0.12"
# The ROS 2 middleware, because walkie-ros and the robot run on Zenoh
# (ADR-0014). 0.2.10's rmw_wait can block forever (ros2/rmw_zenoh#1032);
# 0.2.11 fixes it (ros2/rmw_zenoh#1040). RoboStack's 0.2.11 build
# (hb0f4dca_25) comes from the same stack build as ros-base above (_25), so no
# source build is needed. walkie-agent-ros builds 0.2.11 from source instead,
# because rai-core rejects the OpenCV 5 that RoboStack's 0.2.11 stack needs
# (its ADR-0032). This package also provides the router, rmw_zenohd.
ros-jazzy-rmw-zenoh-cpp = ">=0.2.11,<0.3"
# The sqlite-vec extension (vec0 vector tables) and its Python loader.
# sqlite-vec is not 1.0 yet, so minor releases may change its SQL; move the
# upper bound on purpose, after the tests pass (ADR-0007).
sqlite-vec-python = ">=0.1.9,<0.2"
# The sqlite3 command-line shell, used by `pixi run db-shell`. The library
# itself (libsqlite) comes with Python.
sqlite = ">=3.54.1,<4"
numpy = ">=2.5.4,<3"
pytest = ">=9.1.1,<10"
# Build toolchain for this repository's message package, walkie_database_msgs
# in ros2_ws: the same set as walkie-vision uses. ros-base pulls in
# ament_cmake, rosidl_default_generators, CMake and pkg-config only
# indirectly, so they are listed here as well. The compilers build the C and
# C++ type support and the Python extension that rosidl generates. Without
# them and make here, CMake falls back to the system's tools, or to an apt ROS
# install on PATH, if there is one.
# colcon-core pins setuptools below 80, so this environment gets setuptools
# 79.x. colcon-common-extensions also adds pytest-cov, pytest-repeat,
# pytest-rerunfailures and coverage to the test environment. Their pytest
# plugins do nothing unless their options are passed.
colcon-common-extensions = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-rosidl-default-generators = "*"
c-compiler = "*"
cxx-compiler = "*"
cmake = "*"
pkg-config = "*"
make = "*"

[pypi-dependencies]
walkie-database = { path = ".", editable = true }

# Every `pixi run` and `pixi shell` uses Zenoh, as walkie-ros and the robot do,
# even when the calling shell exports another middleware (ADR-0014). Nodes then
# find each other only through a Zenoh router, at rmw_zenoh's default
# tcp/localhost:7447. To use another middleware, set RMW_IMPLEMENTATION in a
# task's `env`, or run `pixi run env RMW_IMPLEMENTATION=rmw_fastrtps_cpp <cmd>`.
# The docs and browse environments leave out the default feature, and with it
# this table, so their own features below set the same value.
[activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"

# Sources ros2_ws's overlay, so that walkie_database_msgs can be imported once
# it is built. Pixi runs this script before it applies [activation.env] and a
# task's env.
[activation]
scripts = ["scripts/activate.sh"]

# The same command as walkie-agent-ros's build-ros2 and walkie-vision's
# build-msgs. Python3_EXECUTABLE is passed explicitly so a user-level
# ~/.colcon/defaults.yaml (often set for an apt ROS install) cannot point CMake
# at the system Python. The next `pixi run` or `pixi shell` sources the
# overlay; the shell that ran the build does not.
[tasks.build-msgs]
cmd = "colcon build --symlink-install --cmake-args -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python"
cwd = "ros2_ws"
description = "Build the walkie_database_msgs package in ros2_ws with colcon"

# The test task does not depend on build-msgs: pixi computes the environment
# before it runs a dependency, so the overlay would still be missing in the
# first run after a build. tests/conftest.py says what to run instead.
[tasks.test]
cmd = "pytest"
description = "Run the test suite"

[tasks.db-node]
cmd = "python -m walkie_database.node"
description = "Run the database node (opens data/walkie.db and updates its schema)"

# -readonly so a look around cannot change the file while the node runs.
# The .load line adds sqlite-vec, without which vec0 tables cannot be read.
[tasks.db-shell]
cmd = 'sqlite3 -readonly -cmd ".load $CONDA_PREFIX/lib/sqlite-vec/vec0" -cmd ".mode box" data/walkie.db'
description = "Open data/walkie.db read-only in the sqlite3 shell, with sqlite-vec loaded"

[feature.docs.tasks]
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"

[feature.docs.dependencies]
mkdocs-material = ">=9.7,<10"
mkdocs = ">=1.6,<2"

# The docs environment has no ROS, but sets the same middleware as
# [activation.env] above, so that every environment agrees (ADR-0014).
[feature.docs.activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"

# Datasette, a read-only web viewer, in its own environment so that its web
# server dependencies stay out of the robot's environment.
[feature.browse.dependencies]
python = "3.12.*"
# Datasette 1.0 (in alpha) changes plugins and settings; move to it on purpose.
datasette = ">=0.65.5,<0.66"
# Only the loadable vec0 library: Datasette loads it with --load-extension.
libsqlite-vec = ">=0.1.9,<0.2"

# No ROS here either. The same middleware as every other environment
# (ADR-0014).
[feature.browse.activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"

# Opens every file in data/ as its own database. The plugin hides the internal
# tables behind vector, R*Tree, Geopoly and full-text tables.
[feature.browse.tasks.db-browse]
cmd = 'datasette serve data/*.db --load-extension "$CONDA_PREFIX/lib/sqlite-vec/vec0" --plugins-dir datasette-plugins'
description = "Browse every database in data/ read-only in a web browser, at http://127.0.0.1:8001"

[tasks.db-seed]
cmd = "python -m walkie_database.seed"
description = "Fill data/demo.db with a sample house, people and conversation (never data/walkie.db)"

[environments]
docs = { features = ["docs"], no-default-feature = true }
browse = { features = ["browse"], no-default-feature = true }
