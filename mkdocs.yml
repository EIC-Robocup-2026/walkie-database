site_name: Walkie Database
site_description: Documentation for Walkie's long-term memory database (EIC RoboCup 2026)
site_url: https://eic-robocup-2026.github.io/walkie-database/
repo_url: https://github.com/EIC-Robocup-2026/walkie-database
repo_name: EIC-Robocup-2026/walkie-database
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

plugins:
  - search

# Links that start with "/" are resolved from docs/, so a link inside an ADR
# works both on the ADR's own page and where it is embedded.
validation:
  links:
    absolute_links: relative_to_docs

# ADRs are embedded in the architecture pages instead of listed in the menu.
not_in_nav: |
  architecture/decisions/*

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  # Embeds ADR files into the architecture pages. Paths are relative to docs/,
  # and a missing file or section fails the build.
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Setup Log:
      - setup/index.md
      - 1. Create the Pixi Workspace: setup/01-pixi-workspace.md
      - 2. Add the Documentation Site: setup/02-documentation.md
      - 3. Add SQLite and sqlite-vec: setup/03-sqlite.md
      - 4. Write the Schema and Migrations: setup/04-schema-and-migrations.md
      - 5. Run It as a ROS 2 Node: setup/05-ros-node.md
      - 6. Add Sample Data and a Browser: setup/06-sample-data-and-browser.md
      - 7. Use the Zenoh Middleware: setup/07-zenoh.md
  - Architecture:
      - architecture/index.md
      - The Database: architecture/database.md
      - Object Memory (Proposed): architecture/object-memory.md
