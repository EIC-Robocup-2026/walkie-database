- {body: chula_kitchen_table, key: kitchen_table, label: table}
- {body: chula_bar, key: bar, label: table}
- {body: chula_shelf, key: shelf, label: shelf}
- {body: chula_stool_1, key: stool_1, label: chair}
- {body: chula_stool_2, key: stool_2, label: chair}
- {body: chula_stool_3, key: stool_3, label: chair}
