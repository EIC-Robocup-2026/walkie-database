name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs on main are never
# cancelled, so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Only runs on main save the environment to the cache; pull requests
      # restore it, so the repository's limited cache storage holds one copy.
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      # walkie_database_msgs nests walkie_vision_msgs, from the commit that
      # ros2_ws.repos pins. That commit must be on GitHub for this to pass.
      - name: Import the pinned walkie-vision commit
        run: pixi run import-interfaces

      # The node's tests import walkie_database_msgs, which colcon builds into
      # ros2_ws/install; scripts/activate.sh sources it in the next pixi run.
      - name: Build the message packages
        run: pixi run build-msgs

      # These tests include tests/test_pair_check.py, which checks the pair gate's
      # own parts. The gate itself, tools/pair_check.py, runs locally for now: it
      # needs both worktrees. Once the pinned walkie-vision commit is on GitHub,
      # this job should run it against that pin.
      - name: Run tests
        run: pixi run test
